<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body{ font: 14px sans-serif; }
        .wrapper{ width: 400px; padding: 20px; margin: 100px auto; }
        .invalid-feedback { display: none; width: 100%; margin-top: .25rem; font-size: 80%; color: #dc3545; }
        .is-invalid ~ .invalid-feedback,
        .input-group.is-invalid ~ .invalid-feedback { display: block; }
        .input-group.is-invalid .form-control { border-color: #dc3545; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>ログイン</h2>
        <form id="login-form" action="/test/php/login.php" method="post" novalidate>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="text" name="email" class="form-control" placeholder="メールアドレス">
                <span class="invalid-feedback"></span>
            </div>
            <div class="form-group">
                <label>パスワード</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control" placeholder="パスワード">
                    <div class="input-group-append">
                        <span class="input-group-text" style="cursor: pointer;">
                            <i class="fas fa-eye" id="password-toggle-icon"></i>
                        </span>
                    </div>
                </div>
                <span class="invalid-feedback"></span>
            </div>
            <div class="form-group text-center">
                <input type="submit" class="btn btn-primary" value="ログイン">
            </div>
            <p class="text-center"><a href="register.html">アカウントをお持ちでない方はこちら</a></p>
        </form>
        <div id="response-message" class="mt-3"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('password-toggle-icon');
        if (toggleIcon) {
            toggleIcon.parentElement.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.classList.toggle('fa-eye');
                toggleIcon.classList.toggle('fa-eye-slash');
            });
        }

        const loginForm = document.getElementById('login-form');
        const responseMessage = document.getElementById('response-message');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            responseMessage.innerHTML = '';
            responseMessage.className = 'mt-3';
            document.querySelectorAll('.is-invalid').forEach(el => {
                el.classList.remove('is-invalid');
                let formGroup = el.closest('.form-group');
                if (formGroup) {
                    let feedback = formGroup.querySelector('.invalid-feedback');
                    if (feedback) feedback.textContent = '';
                }
            });
            document.querySelectorAll('.input-group.is-invalid').forEach(el => el.classList.remove('is-invalid'));

            const formData = new FormData(loginForm);
            
            fetch(loginForm.action, { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('jwt_token', data.token);
                    window.location.href = 'start.html';
                } else if (data.errors) {
                    Object.keys(data.errors).forEach(key => {
                        const input = loginForm.querySelector(`[name="${key}"]`);
                        if (input) {
                            input.classList.add('is-invalid');
                            if (input.parentElement.classList.contains('input-group')) {
                                input.parentElement.classList.add('is-invalid');
                            }
                            const formGroup = input.closest('.form-group');
                            const feedback = formGroup.querySelector('.invalid-feedback');
                            if (feedback) {
                                feedback.textContent = data.errors[key];
                            }
                        }
                    });
                } else {
                    responseMessage.className = 'alert alert-danger';
                    responseMessage.textContent = data.error || '不明なエラーが発生しました。';
                }
            })
            .catch(error => {
                responseMessage.className = 'alert alert-danger';
                responseMessage.textContent = 'リクエスト中にエラーが発生しました。';
                console.error('Error:', error);
            });
        });
    });
    </script>
</body>
</html>
