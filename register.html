<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="background">
        <div class="container">
            <img src="image/logo.png" alt="ロゴ" class="logo">
            <img src="image/title_register.png" alt="ログイン" class="title">  
            <form id="register-form" action="php/register.php" method="post" novalidate>
                    <div class="form-group">
                        <input type="text" name="email" id="email-input" class="form-control" placeholder="メールアドレス">
                        <span class="invalid-feedback"></span>
                    </div>
                    <div class="form-group">
                        <input type="password" name="password" id="password-input" class="form-control" placeholder="パスワード">
                        <span class="invalid-feedback"></span>
                    </div>
                    <div class="form-group">
                        <input type="password" name="confirm_password" id="confirm-password-input" class="form-control" placeholder="パスワード確認">
                        <span class="invalid-feedback"></span>
                    </div>
                
                <img src="image/register_button.png" alt="新規登録" id="register-button" class="submit-button">
            </form>
            
            <a href="login.html" class="link-to-login"> <img src="image/existing_account_link.png" alt="既にアカウントを持っている方"> </a>

            <div id="response-message" class="mt-3"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('register-form');
        const registerButton = document.getElementById('register-button');
        const responseMessage = document.getElementById('response-message');

        if (registerButton) {
            registerButton.addEventListener('click', function() {
                registerForm.dispatchEvent(new Event('submit', { cancelable: true }));
            });
        }

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            responseMessage.innerHTML = '';
            responseMessage.className = 'mt-3';
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            document.querySelectorAll('.invalid-feedback').forEach(el => el.textContent = '');

            const formData = new FormData(registerForm);

            fetch(registerForm.action, { method: 'POST', body: formData })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    responseMessage.className = 'alert alert-success';
                    responseMessage.textContent = data.message;
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else if (data.errors) {
                    Object.keys(data.errors).forEach(key => {
                        const input = registerForm.querySelector(`[name="${key}"]`);
                        if (input) {
                            input.classList.add('is-invalid');
                            const feedback = input.nextElementSibling;
                            if (feedback && feedback.classList.contains('invalid-feedback')) {
                                feedback.textContent = data.errors[key];
                            }
                        }
                    });
               } else {
                    responseMessage.className = 'alert alert-danger';
                    responseMessage.textContent = data.error || '不明なエラーが発生しました。';
                }
            })
            .catch(error => {
                responseMessage.className = 'alert alert-danger';
                responseMessage.textContent = 'リクエスト中にエラーが発生しました。';
                console.error('Error:', error);
            });
        });
    });
    </script>
</body>
</html>
