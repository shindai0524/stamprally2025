<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body{ font: 14px sans-serif; }
        .wrapper{ width: 400px; padding: 20px; margin: 100px auto; }
    </style>
</head>
<body>
    <div class="wrapper">
        <h2>新規登録</h2>
        <form id="register-form" action="php/register.php" method="post" novalidate>
            <div class="form-group">
                <label>メールアドレス</label>
                <input type="text" name="email" class="form-control" placeholder="メールアドレス">
                <span class="invalid-feedback"></span>
            </div>
            <div class="form-group">
                <label>パスワード</label>
                <input type="password" name="password" class="form-control" placeholder="パスワード">
                <span class="invalid-feedback"></span>
            </div>
            <div class="form-group">
                <label>パスワード（確認用）</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="パスワード（確認用）">
                <span class="invalid-feedback"></span>
            </div>
            <div class="form-group text-center">
                <input type="submit" class="btn btn-primary" value="新規登録">
            </div>
            <p class="text-center"><a href="login.html">既にアカウントをお持ちの方はこちら</a></p>
        </form>
        <div id="response-message" class="mt-3"></div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const registerForm = document.getElementById('register-form');
        const responseMessage = document.getElementById('response-message');

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();
            // --- 以前のエラー表示をクリア ---
            responseMessage.innerHTML = '';
            responseMessage.className = 'mt-3';
            document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
            document.querySelectorAll('.invalid-feedback').forEach(el => el.textContent = '');

            const formData = new FormData(registerForm);

            fetch(registerForm.action, { method: 'POST', body: formData })
            .then(response => {
                // ★★★ ここからが修正のキモ ★★★
                // 応答がJSON形式であることを期待して、常にJSONとして解析を試みる
                return response.json().then(data => {
                    // 応答がOKでない場合（400エラーなど）は、データを持ってrejectする
                    if (!response.ok) {
                        return Promise.reject(data);
                    }
                    return data;
                });
            })
            .then(data => {
                // --- 成功時の処理 ---
                responseMessage.className = 'alert alert-success';
                responseMessage.textContent = data.message + ' 2秒後にログイン画面に移動します。';
                setTimeout(() => window.location.href = 'login.html', 2000);
            })
            .catch(errorData => {
                // --- エラー時の処理 ---
                if (errorData && errorData.errors) {
                    // バリデーションエラーの表示
                    Object.keys(errorData.errors).forEach(key => {
                        const input = registerForm.querySelector(`[name="${key}"]`);
                        if (input) {
                            input.classList.add('is-invalid');
                            const feedback = input.nextElementSibling;
                            if (feedback && feedback.classList.contains('invalid-feedback')) {
                                feedback.textContent = errorData.errors[key];
                            }
                        }
                    });
                } else {
                    // その他の予期せぬエラー
                    responseMessage.className = 'alert alert-danger';
                    responseMessage.textContent = 'リクエスト中に予期せぬエラーが発生しました。';
                    console.error('Error:', errorData);
                }
            });
        });
    });
    </script>
</body>
</html>
