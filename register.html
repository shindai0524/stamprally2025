<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <h2>新規登録</h2>
        <form id="register-form" action="php/register.php" method="post">
            <p>メールアドレス</p>
            <div class="form-group">
                <input type="text" name="email" class="form-control" placeholder="メールアドレス">
                <span class="invalid-feedback"></span>
            </div>
            <p>パスワード</p>
            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="パスワード">
                <span class="invalid-feedback"></span>
            </div>
            <p>パスワード(確認用)</p>
            <div class="form-group">
                <input type="password" name="confirm_password" class="form-control" placeholder="パスワード（確認用）">
                <span class="invalid-feedback"></span>
            </div>
            <div class="form-group submit-btn-area">
                <input type="submit" class="btn btn-primary" value="新規登録">
            </div>
            <a href="login.html">アカウントをお持ちの方はこちら</a>
        </form>

        <div id="response-message" class="mt-3"></div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const registerForm = document.getElementById('register-form');
    const responseMessage = document.getElementById('response-message');

    registerForm.addEventListener('submit', function(e) {
        e.preventDefault();

        // ★★★ ここからが修正・追加箇所 ★★★
        // 以前のエラー表示をすべてクリアする
        responseMessage.innerHTML = '';
        responseMessage.className = 'mt-3';

        document.querySelectorAll('.is-invalid').forEach(function(element) {
            element.classList.remove('is-invalid');
        });
        document.querySelectorAll('.invalid-feedback').forEach(function(element) {
            element.textContent = '';
        });
        // ★★★ ここまでが修正・追加箇所 ★★★

        const formData = new FormData(registerForm);

        fetch(registerForm.action, { method: 'POST', body: formData })
            .then(response => {
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.indexOf("application/json") !== -1) {
                    return response.json();
                } else {
                    return response.text().then(text => { throw new Error("サーバーから予期しない応答がありました:\n" + text) });
                }
            })
            .then(data => {
                if (data.message) {
                    responseMessage.className = 'alert alert-success';
                    responseMessage.textContent = data.message;
                    setTimeout(function() {
                        window.location.href = 'login.html';
                    }, 1500);
                } else if (data.errors) {
                    Object.keys(data.errors).forEach(key => {
                        const input = registerForm.querySelector(`[name="${key}"]`);
                        if (input) {
                            input.classList.add('is-invalid');
                            // inputの次の要素にエラーメッセージを設定
                            const feedback = input.nextElementSibling;
                            if (feedback && feedback.classList.contains('invalid-feedback')) {
                                feedback.textContent = data.errors[key];
                            }
                        }
                    });
               } else {
                    responseMessage.className = 'alert alert-danger';
                    responseMessage.textContent = data.error || '不明なエラーが発生しました。';
                }
            })
            .catch(error => {
                responseMessage.className = 'alert alert-danger';
                responseMessage.textContent = 'リクエスト中にエラーが発生しました。';
                console.error('Error:', error);
            });
    });
});
</script>
</body>
</html>
