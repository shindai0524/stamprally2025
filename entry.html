<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>景品応募フォーム</title>
  <link rel="stylesheet" href="entry.css">
</head>
<body>
  <div class="top-background"></div>
  <div class="header-image">
  <img src="/image/entry_header.png" alt="ヘッダーに重ねる画像">
  </div>

  <button id="backButton" onclick="location.href='index.html'"></button>

  <div class="container">
    <form id="userForm">
      <div class="input-wrapper">
        <img src="/image/name.png" alt="氏名枠">
        <input type="text" id="name" required>
      </div>
      <div class="input-wrapper">
        <img src="/image/num_phone.png" alt="電話枠">
        <input type="tel" id="tel" required>
      </div>
      <div class="input-wrapper">
        <img src="/image/num_yubin.png" alt="郵便枠">
        <input type="text" id="zip" required>
      </div>
      <div class="input-wrapper">
        <img src="/image/address.png" alt="住所枠">
        <input type="text" id="address" required>
      </div>
      <div class="input-wrapper">
        <img src="/image/mail_address.png" alt="メール枠">
        <input type="email" id="email" required>
      </div>
    </form>

    <div id="prizes">
      <div class="prize-card">
        <img class="prize-overlay" src="/image/sanka_prize.png" alt="上部画像">
        <br>
        <img src="img/participation.png" alt="参加賞">
        <!-- 各賞のボタン部分の修正（共通） -->
        <button class="entry-button" data-prize="participation">
          <img src="/image/entry_button.png" alt="応募するボタン">
        </button>

      </div>
      <div class="prize-card">
        <h3>抽選賞B</h3>
        <img src="img/prize_b.png" alt="抽選賞B">
        <!-- 各賞のボタン部分の修正（共通） -->
        <button class="entry-button" data-prize="b">
          <img src="/image/entry_button.png" alt="応募するボタン">
        </button>

      </div>
      <div class="prize-card">
        <h3>抽選賞A</h3>
        <img src="img/prize_a.png" alt="抽選賞A">
        <!-- 各賞のボタン部分の修正（共通） -->
        <button class="entry-button" data-prize="a">
          <img src="/image/entry_button.png" alt="応募するボタン">
        </button>

      </div>
      <div class="prize-card">
        <h3>特賞（登別温泉宿泊券）</h3>
        <img src="img/hotel.png" alt="特賞">
        <!-- 各賞のボタン部分の修正（共通） -->
        <button class="entry-button" data-prize="special">
          <img src="/image/entry_button.png" alt="応募するボタン">
        </button>

      </div>
    </div>
  </div>

  <script src="entry.js"></script>
</body>
</html>
