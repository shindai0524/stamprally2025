<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QRコードリーダー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: sans-serif;
      background-image: url('/image/code-background2.png');
      background-repeat: no-repeat;
      background-size: 100% auto;
      background-position: bottom center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .camera-area-wrapper {
      position: relative;
      width: 90vw;
      max-width: 230px;
      margin: 30px auto 10px;
      overflow: hidden;
      z-index: 10;
      aspect-ratio: 1 / 1;
      padding-top: 45%; /* fallback */
    }

    .camera-area-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 28px;
      object-fit: cover;
    }

    .scan-frame-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      max-width: 350px;
      z-index: 20;
      pointer-events: none;
    }

    .controls {
      position: relative;
      text-align: center;
    }

    .success-wrapper {
      position: absolute;
      bottom: calc(100% - 300px);
      left: 50%;
      transform: translateX(-50%) translateY(-5px);
      z-index: 20;
      pointer-events: none;
    }

    .success-image {
      width: 250px;
      display: block;
    }

    .scan-button {
      width: 130px;
      cursor: pointer;
      margin: 60px auto 0;
      display: block;
    }

    .back-button {
      width: 100px;
      margin: 20px auto 0;
      cursor: pointer;
      display: block;
    }

    .hidden {
      display: none;
    }

    #message {
      font-size: 14px;
      margin-top: 5px;
      color: #333;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="camera-area-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <img src="/image/code-waku.png" alt="スキャン枠" class="scan-frame-image">
  </div>

  <div class="controls">
    <div class="success-wrapper">
      <img id="successImage" src="/image/success.png" alt="成功" class="success-image hidden">
    </div>
    <img id="scanBtn" src="/image/scan.png" alt="QRを読み取る" class="scan-button">
    <div id="message">QRコードを読み取ってください</div>
    <img id="backBtn" src="/image/close.png" alt="戻る" class="back-button" onclick="location.href='/index.html'">
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const scanBtn = document.getElementById('scanBtn');
    const message = document.getElementById('message');
    const successImage = document.getElementById('successImage');

    let scanner = null;
    let scanning = false;

    window.addEventListener('load', async () => {
      scanner = new QrScanner(video, result => handleResult(result.data), {
        highlightScanRegion: false,
      });
      await scanner.start();
      scanning = true;
    });

    scanBtn.addEventListener('click', async () => {
      if (!scanning) {
        await scanner.start();
        scanning = true;
        successImage.classList.add("hidden");
        message.textContent = "QRコードを読み取ってください";
      }
    });

    function handleResult(data) {
      scanner.stop();
      scanning = false;

      const matched = data.match(/^https:\/\/stamp\.onista-noboribetsu\.com\/quiz\.html\?id=([1-9]|[1-4][0-9])$/);
      if (matched) {
        successImage.classList.remove("hidden");

        requestAnimationFrame(() => {
          setTimeout(() => {
            window.location.href = data;
          }, 1000);
        });
      } else {
        message.textContent = "有効なQRコードではありません。再度読み取りボタンを押してください。";
      }
    }
  </script>
</body>
</html>
