<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>QRコードリーダー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* 画面全体を覆い、中央に配置＆スクロール禁止 */
    html, body {
      height: 100%;
      overflow: hidden;                 /* ← スクロール禁止 */
    }
    body {
      font-family: sans-serif;
      background-image: url('/image/code-background2.png');
      background-repeat: no-repeat;
      background-size: cover;           /* 全画面フィット */
      background-position: center;
      display: flex;
      justify-content: center;          /* 横中央 */
      align-items: center;              /* 縦中央 */
      touch-action: none;               /* iOSでの意図しないスクロール防止に寄与 */
    }

    /* 中央にまとめるラッパー（縦並び） */
    .center-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 360px;                 /* レイアウトの暴走防止 */
      padding: 16px;
    }

    /* カメラ領域（正方形） */
    .camera-area-wrapper {
      position: relative;
      width: 80vw;                      /* 画面に応じて伸縮 */
      max-width: 270px;
      aspect-ratio: 1 / 1;              /* 正方形を維持 */
      border-radius: 28px;
      overflow: hidden;
      background: #000;                 /* 読み込み前の背景色 */
    }
    .camera-area-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    /* スキャン枠（上に重ねる） */
    .scan-frame-image {
      position: absolute;
      inset: 0;                         /* 四辺ぴったり */
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 20;
      pointer-events: none;
    }

    /* 成功演出（上部にフロート表示） */
    .success-wrapper {
      position: relative;
      height: 0;                        /* レイアウトに影響させない */
    }
    .success-image {
      position: absolute;
      left: 50%;
      top: -10px;                       /* カメラ枠の少し上に重ねる */
      transform: translateX(-50%);
      width: 200px;
      display: block;
      z-index: 30;
    }

    /* ボタン群 */
    .controls {
      text-align: center;
      width: 100%;
    }
    .scan-button {
      width: 130px;
      cursor: pointer;
      display: block;
      margin: 8px auto 0;
    }
    .back-button {
      width: 100px;
      margin: 14px auto 0;
      cursor: pointer;
      display: block;
    }

    .hidden { display: none !important; }

    #message {
      font-size: 14px;
      margin-top: 6px;
      color: #333;
      text-align: center;
    }

    /* 画面がとても小さい端末向けの微調整 */
    @media (max-width: 360px) {
      .success-image { width: 180px; top: -28px; }
      .scan-button { width: 120px; }
      .back-button { width: 92px; }
    }
  </style>
</head>
<body>
  <div class="center-wrapper">
    <div class="camera-area-wrapper">
      <video id="video" autoplay muted playsinline></video>
      <img src="/image/code-waku.png" alt="スキャン枠" class="scan-frame-image">
    </div>

    <div class="success-wrapper">
      <img id="successImage" src="/image/success.png" alt="成功" class="success-image hidden">
    </div>

    <div class="controls">
      <img id="scanBtn" src="/image/scan.png" alt="QRを読み取る" class="scan-button">
      <div id="message">QRコードを読み取ってください</div>
      <img id="backBtn" src="/image/close.png" alt="戻る" class="back-button" onclick="location.href='/home.php'">
    </div>
  </div>

  <!-- QR Scanner ライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js"></script>
  <script>
    // --- ログイン状態チェック（未ログインなら login.html にリダイレクト） ---
    document.addEventListener("DOMContentLoaded", () => {
      const sessionId = localStorage.getItem('session_id');
      if (!sessionId) {
        alert("ログインしていません。ログイン画面に移動します。");
        window.location.href = "login.html";
      }
    });

    const video = document.getElementById('video');
    const scanBtn = document.getElementById('scanBtn');
    const message = document.getElementById('message');
    const successImage = document.getElementById('successImage');

    let scanner = null;
    let scanning = false;

    // スキャン開始
    scanBtn.addEventListener('click', async () => {
      if (scanning) return;

      try {
        scanner = new QrScanner(video, result => handleResult(result.data), {
          highlightScanRegion: false,
        });

        await scanner.start();
        scanning = true;
        successImage.classList.add("hidden");
        message.textContent = "QRコードを読み取ってください";
      } catch (err) {
        console.error(err);
        message.textContent = "カメラの起動に失敗しました";
      }
    });

    // スキャン成功時の処理
    function handleResult(data) {
      if (scanner) scanner.stop();
      scanning = false;

      const matched = data.match(/^https:\/\/stamp\.onista-noboribetsu\.com\/quiz\.html\?id=onista_[a-zA-Z0-9]{4}$/);

      if (matched) {
        successImage.classList.remove("hidden");
        // 少し演出してから遷移
        requestAnimationFrame(() => {
          setTimeout(() => { window.location.href = data; }, 1000);
        });
      } else {
        message.textContent = "有効なQRコードではありません。再度読み取りボタンを押してください。";
      }
    }

    // ページ遷移や非表示時にカメラ停止（メモリリーク防止）
    const stopCamera = () => {
      if (scanner) {
        scanner.stop();
        scanning = false;
      }
      if (video && video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
    };
    window.addEventListener('pagehide', stopCamera);
    window.addEventListener('beforeunload', stopCamera);
  </script>
</body>
</html>
