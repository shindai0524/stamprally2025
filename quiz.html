    const params = new URLSearchParams(window.location.search);
    const quizId = parseInt(params.get("id"));
    const question = questions.find(q => q.id === quizId);

    const quizQuestion = document.getElementById("quizQuestion");
    const quizOptions = document.getElementById("quizOptions");
    const quizSection = document.getElementById("quizSection");
    const correctSection = document.getElementById("correctSection");
    const wrongSection = document.getElementById("wrongSection");

    if (!question) {
      quizQuestion.textContent = "このIDに対応する問題はありません。";
    } else {
      const stampKey = `stamp${question.id}`;
      const obtained = JSON.parse(localStorage.getItem("obtainedStamps")) || {};

      if (obtained[stampKey]) {
        quizSection.innerHTML = `<h2>このスタンプはすでに獲得済みです。</h2>`;
      } else {
        quizQuestion.textContent = question.question;
        quizOptions.innerHTML = "";

        question.options.forEach((opt, index) => {
          const btn = document.createElement("button");
          btn.textContent = opt;
          btn.className = "option-button";
          btn.onclick = () => checkAnswer(index);
          quizOptions.appendChild(btn);
        });
      }
    }

    function checkAnswer(selected) {
      if (selected === question.answer) {
        // 正解: localStorage に保存
        const obtained = JSON.parse(localStorage.getItem("obtainedStamps")) || {};
        obtained[`stamp${question.id}`] = {
          date: new Date().toLocaleString()
        };
        localStorage.setItem("obtainedStamps", JSON.stringify(obtained));

        quizSection.classList.add("hidden");
        correctSection.classList.remove("hidden");
      } else {
        quizSection.classList.add("hidden");
        wrongSection.classList.remove("hidden");
      }
    }

    function retryQuiz() {
      wrongSection.classList.add("hidden");
      quizSection.classList.remove("hidden");
    }

    function goHome() {
      window.location.href = "home.html";
    }
