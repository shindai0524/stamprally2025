<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>スタート</title>
    <link rel="icon" href="https://glitch.com/favicon.ico" />
    <link rel="stylesheet" href="index_style.css" />
    
    <style>
      /* 認証が完了するまでページ本体を非表示にし、ちらつきを防ぐ */
      body {
        visibility: hidden;
      }
    </style>
    <script>
      /**
       * JWTのペイロード部分をデコードする関数
       */
      function parseJwt(token) {
        try {
          const base64Url = token.split(".")[1];
          const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
          const jsonPayload = decodeURIComponent(
            atob(base64)
              .split("")
              .map(function (c) {
                return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
              })
              .join("")
          );
          return JSON.parse(jsonPayload);
        } catch (e) {
          return null;
        }
      }

      /**
       * ページの読み込み時にユーザーの認証状態をチェックする関数
       */
      function checkAuthentication() {
        const token = localStorage.getItem("jwt_token");

        // 1. トークンが存在しない場合はログインページへリダイレクト
        if (!token) {
          window.location.href = "login.html";
          return;
        }

        const payload = parseJwt(token);

        // 2. トークンが不正、または有効期限切れの場合もログインページへリダイレクト
        if (!payload || payload.exp * 1000 < Date.now()) {
          localStorage.removeItem("jwt_token"); // 古いトークンを削除
          window.location.href = "login.html";
          return;
        }

        // 3. 認証が成功した場合、ページ本体を表示する
        document.body.style.visibility = 'visible';
      }

      // ページの読み込みが始まったら、すぐに認証チェックを実行
      checkAuthentication();
    </script>
    </head>
  <body>
    <div class="container">
      <div class="title">
        <img src="https://www.sapporo.coop/assets/img/common/logo.svg" />
      </div>

      <div class="start-btn">
        <img
          id="start-button"
          src="https://cdn.glitch.global/181ed6db-f6a0-4bf6-b0cd-9267edda932c/%E3%82%B9%E3%82%BF%E3%83%BC%E3%83%88%E3%83%9C%E3%82%BF%E3%83%B3_80px.png?v=1689044088845"
          style="cursor: pointer;"
        />
      </div>

      <div class="char">
        <img
          src="https://www.sapporo.coop/about/images/cassette_3_img03_20230126_171028.png"
        />
      </div>
    </div>

    <script>
      const startButton = document.getElementById("start-button");
      if (startButton) {
        startButton.addEventListener("click", () => {
          // スタートボタンが押された際の処理（例: 次のページへ遷移）
          // window.location.href = "next_page.html";
          alert("スタートします！");
        });
      }
    </script>
  </body>
</html>
